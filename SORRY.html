<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐧💕 Pink Dolphin & Penguin — Sorry</title>
    <!-- Emoji Favicon for the browser tab -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐧</text></svg>">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'Quicksand', system-ui, -apple-system, sans-serif;
            background: linear-gradient(145deg, #ffe9f4 0%, #ffd9e8 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            color: #4a2c3a;
            transition: background 0.3s;
        }

        .card {
            max-width: 700px;
            width: 100%;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 56px 56px 48px 48px;
            box-shadow: 0 20px 40px rgba(255, 160, 200, 0.4), 0 8px 20px rgba(0, 0, 0, 0.05);
            padding: 2rem 1.8rem 2.2rem;
            border: 2px solid #fff5fa;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            font-size: 2.4rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            text-align: center;
            color: #b33f6b;
            text-shadow: 0 2px 8px #ffe2f0;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .page-content {
            min-height: 320px;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.2s;
        }

        .emoji-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
            font-size: 4.6rem;
            line-height: 1.3;
            margin: 0.5rem 0 0.8rem;
            flex-wrap: wrap;
            filter: drop-shadow(0 8px 12px rgba(255, 120, 160, 0.2));
        }

        .bear-image-container {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0.5rem 0 1rem;
        }

        .bear-image-container img {
            max-width: 100%;
            height: auto;
            max-height: 160px;
            border-radius: 20px;
            filter: drop-shadow(0 8px 12px rgba(255, 120, 160, 0.2));
        }

        .pink-dolphin {
            animation: float 3s ease-in-out infinite;
            display: inline-block;
            filter: drop-shadow(0 0 12px #ffb6d9);
        }

        .penguin {
            animation: float 3.5s ease-in-out infinite reverse;
            display: inline-block;
            filter: drop-shadow(0 0 8px #c0d4ff);
        }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .message-box {
            background: #fff6fb;
            border-radius: 48px;
            padding: 1.8rem 1.8rem;
            width: 100%;
            text-align: center;
            border: 2px dashed #ffb0ce;
            margin: 1rem 0 1.4rem;
            box-shadow: inset 0 2px 10px rgba(255, 200, 220, 0.5);
        }

        .message-text {
            font-size: 1.5rem;
            line-height: 1.5;
            font-weight: 500;
            color: #6b3e52;
            word-break: break-word;
        }

        .btn-group {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 1rem;
        }

        button {
            background: #ff9dc4;
            border: none;
            border-radius: 60px;
            padding: 0.85rem 1.8rem;
            font-size: 1.2rem;
            font-weight: 600;
            color: #4f2438;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            cursor: pointer;
            box-shadow: 0 8px 0 #c95d89, 0 6px 18px #ffb8d2;
            transition: all 0.07s ease;
            border: 1px solid #fff2f9;
            letter-spacing: 0.3px;
            font-family: inherit;
        }

        button:active {
            transform: translateY(6px);
            box-shadow: 0 2px 0 #c95d89, 0 6px 18px #ffb8d2;
        }

        .shake-back {
            animation: shakeUpDown 0.4s ease-in-out;
        }

        @keyframes shakeUpDown {
            0% { transform: translateY(0); }
            25% { transform: translateY(-15px); }
            50% { transform: translateY(10px); }
            75% { transform: translateY(-5px); }
            100% { transform: translateY(0); }
        }

        .page-indicator {
            display: flex;
            justify-content: center;
            gap: 0.8rem;
            margin-top: 2rem;
        }

        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ffbfd9;
            transition: all 0.2s;
            border: 1px solid #ff9dc4;
        }

        .dot.active {
            background: #d44b84;
            transform: scale(1.3);
            box-shadow: 0 0 10px #ff85b3;
        }

        .hearts {
            font-size: 1.4rem;
            letter-spacing: 4px;
            margin-top: 0.2rem;
            opacity: 0.8;
        }

        @media (max-width: 520px) {
            .card { padding: 1.6rem 1rem; }
            h1 { font-size: 1.9rem; }
            .emoji-row { font-size: 3.5rem; }
            .message-text { font-size: 1.3rem; }
            button { font-size: 1rem; padding: 0.7rem 1.2rem; }
        }
    </style>
</head>
<body>

<div class="card" id="app">
    <div id="pageContainer" class="page-content"></div>
    
    <div class="page-indicator" id="indicator">
        <span class="dot active" data-page="0"></span>
        <span class="dot" data-page="1"></span>
        <span class="dot" data-page="2"></span>
    </div>
</div>

<script>
    (function() {
        const pages = [
            {   
                title: '🐧  I\'m sorry  🐬',
                content: `
                    <div class="emoji-row">
                        <span class="penguin">🐧</span>
                        <span>💗</span>
                        <span class="pink-dolphin">🐬</span>
                    </div>
                    <div class="bear-image-container">
                        <img src="https://media.tenor.com/8Z8Xq7Xw4sAAAAAi/bear-bite.gif" alt="Bears fighting">
                    </div>
                    <div class="message-box">
                        <div class="message-text">
                            Hey my pink dolphin 🐬,<br>
                            this little penguin 🐧 has something to say...
                        </div>
                    </div>
                    <div class="hearts">💗 💕 💗</div>
                `,
                buttons: [
                    { label: 'Next 💌', next: 1 },
                ]
            },
            {   
                title: '🐧 Sorry, my dolphin 🐬',
                content: `
                    <div class="emoji-row">
                        <span class="penguin">🐧</span>
                        <span>😔</span>
                        <span class="pink-dolphin">🐬</span>
                    </div>
                    <div class="message-box">
                        <div class="message-text">
                            I'm really sorry 🐧💔<br>
                            I didn't mean to make you sad.<br>
                            You're my favorite pink dolphin 🐬✨
                        </div>
                    </div>
                    <div class="hearts">🌸 💗 🌸</div>
                `,
                buttons: [
                    { label: '⬅️ Back', next: 0 },
                    { label: 'Next 💞', next: 2 },
                ]
            },
            {   
                title: '🐧💖🐬 Forever',
                content: `
                    <div class="emoji-row">
                        <span class="penguin">🐧</span>
                        <span>🤝</span>
                        <span class="pink-dolphin">🐬</span>
                    </div>
                    <div class="message-box">
                        <div class="message-text">
                            Will you forgive this little penguin? 🐧🥺<br>
                            I promise to make you smile again!<br>
                            <span style="font-size:1.8rem;">🐧❤️🐬</span>
                        </div>
                    </div>
                    <div class="hearts">✨ 💕 ✨</div>
                `,
                buttons: [
                    { label: '⬅️ Back', action: 'block-back' }, 
                    { label: 'I forgive you 💖', action: 'forgive' },
                ]
            }
        ];

        let currentPage = 0;
        const pageContainer = document.getElementById('pageContainer');
        const indicatorDots = document.querySelectorAll('.dot');

        function renderPage(index) {
            const page = pages[index];
            if (!page) return;

            let html = `
                <h1>${page.title}</h1>
                ${page.content}
                <div class="btn-group" id="btnGroup"></div>
            `;
            pageContainer.innerHTML = html;

            const btnGroup = document.getElementById('btnGroup');
            page.buttons.forEach(btn => {
                const button = document.createElement('button');
                if (btn.action === 'forgive') {
                    button.innerHTML = 🐬 ${btn.label} 🐧;
                } else {
                    button.textContent = btn.label;
                }
                
                button.addEventListener('click', (e) => {
                    e.preventDefault();
                    
                    if (btn.next !== undefined) {
                        currentPage = btn.next;
                        renderPage(currentPage);
                        updateIndicator(currentPage);
                    } else if (btn.action === 'block-back') {
                        button.classList.remove('shake-back');
                        void button.offsetWidth; 
                        button.classList.add('shake-back');
                    } else if (btn.action === 'forgive') {
                        showForgiveMessage();
                    }
                });
                btnGroup.appendChild(button);
            });

            updateIndicator(currentPage);
        }

        function showForgiveMessage() {
            const existingOverlay = document.querySelector('.forgive-overlay');
            if (existingOverlay) existingOverlay.remove();

            const overlay = document.createElement('div');
            overlay.className = 'forgive-overlay';
            overlay.style.position = 'fixed';
            overlay.style.top = '50%';
            overlay.style.left = '50%';
            overlay.style.transform = 'translate(-50%, -50%)';
            overlay.style.background = '#fff0f8';
            overlay.style.padding = '2.2rem 2rem';
            overlay.style.borderRadius = '80px';
            overlay.style.boxShadow = '0 25px 40px rgba(255, 100, 150, 0.5)';
            overlay.style.border = '4px solid #ffb8d6';
            overlay.style.zIndex = '9999';
            overlay.style.fontSize = '2rem';
            overlay.style.display = 'flex';
            overlay.style.flexDirection = 'column';
            overlay.style.alignItems = 'center';
            overlay.style.gap = '0.8rem';
            overlay.style.textAlign = 'center';
            overlay.style.color = '#aa3f6b';
            overlay.style.fontWeight = '600';
            overlay.style.backdropFilter = 'blur(12px)';
            overlay.style.transition = 'all 0.2s';
            
            overlay.innerHTML = `
                <div style="font-size:4rem;">🐧❤️🐬</div>
                <div>Thank you my dolphin</div>
                <div style="font-size:1.4rem; font-weight:400;">I promise to give best surprise for this</div>
                <div style="font-size:2rem;">💗💗💗</div>
            `;
            document.body.appendChild(overlay);

            setTimeout(() => {
                overlay.style.opacity = '0';
                overlay.style.transform = 'translate(-50%, -60%) scale(0.9)';
                setTimeout(() => overlay.remove(), 300);
            }, 3500); 
        }

        function updateIndicator(index) {
            indicatorDots.forEach((dot, i) => {
                if (i === index) dot.classList.add('active');
                else dot.classList.remove('active');
            });
        }

        renderPage(0);

        indicatorDots.forEach((dot) => {
            dot.style.cursor = 'default'; 
            dot.style.pointerEvents = 'none'; 
        });

        const styleSheet = document.createElement("style");
        styleSheet.textContent = `
            .forgive-overlay {
                transition: opacity 0.25s, transform 0.25s;
                font-family: 'Segoe UI', 'Quicksand', sans-serif;
            }
        `;
        document.head.appendChild(styleSheet);
    })();
</script>
</body>
</html>
